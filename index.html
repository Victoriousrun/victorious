<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victorius — Em Breve</title>

  <!-- Tipografia Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">

  <style>
    :root {
      --accent: #7928ca;
      --accent-rgb: 121, 40, 202;
      --blue-accent: #0070f3;
      --bg-dark: #0a0a14;
      --text-pure: #ffffff;
      --text-sub: #b3b3cc;
      --text-muted-custom: #6e6e8a;
      --card-glass: rgba(18, 18, 32, 0.65);
      --border-subtle: rgba(138, 75, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-pure);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* Fundo com radial glow azul -> roxo suave irradiando do centro */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle 550px at 50% 45%, rgba(121, 40, 202, 0.18) 0%, rgba(0, 112, 243, 0.12) 45%, transparent 75%),
        radial-gradient(circle 900px at 50% 50%, rgba(10, 10, 20, 0.9) 20%, #0a0a14 100%);
    }

    /* Vinheta delicada */
    .ambient-glow::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, #07070f 95%);
    }

    /* Container principal centralizado */
    .landing-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 12px;
    }

    /* Animação suave escalonada */
    .fade-item {
      opacity: 0;
      transform: translateY(16px);
      animation: smoothFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .fade-delay-1 { animation-delay: 0.1s; }
    .fade-delay-2 { animation-delay: 0.22s; }
    .fade-delay-3 { animation-delay: 0.34s; }
    .fade-delay-4 { animation-delay: 0.46s; }
    .fade-delay-5 { animation-delay: 0.58s; }

    @keyframes smoothFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-item { animation: none; opacity: 1; transform: none; }
      .logo-image, .badge-dot { animation: none; }
    }

    /* Pulso no glow da logo */
    @keyframes logoPulse {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(121, 40, 202, 0.55)) drop-shadow(0 0 35px rgba(0, 112, 243, 0.3));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 28px rgba(138, 75, 255, 0.8)) drop-shadow(0 0 50px rgba(0, 112, 243, 0.45));
        transform: scale(1.02);
      }
    }

    /* =====================================================================
       ÁREA DA LOGO (PNG)
       Ajuste o tamanho da logo mudando --logo-width.
       Desktop: largura da logo | Mobile: largura da logo no celular
       ===================================================================== */
    .logo-container {
      --logo-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo-image {
      width: var(--logo-width);
      max-width: 80vw;
      height: auto;
      /* Pulso suave com glow roxo/azul. Para desligar, apague a linha abaixo. */
      animation: logoPulse 4.5s ease-in-out infinite;
    }

    /* Texto só para leitores de tela / SEO (não aparece visualmente) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Badge Em Breve */
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(121, 40, 202, 0.12);
      border: 1px solid rgba(138, 75, 255, 0.38);
      color: #d8b4fe;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(121, 40, 202, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #a855f7;
      box-shadow: 0 0 8px #c084fc;
      animation: blink 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Headline & Sublinha */
    .headline {
      font-size: clamp(1.45rem, 3.8vw, 2.15rem);
      font-weight: 700;
      line-height: 1.28;
      color: #ffffff;
      max-width: 580px;
      margin: 0 auto 12px;
      letter-spacing: -0.015em;
    }

    .subline {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 400;
      color: var(--text-sub);
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.5;
    }

    /* Ações / Botões */
    .action-group {
      display: flex;
      flex-direction: row;
      gap: 14px;
      width: 100%;
      max-width: 480px;
      justify-content: center;
      margin: 0 auto;
    }

    .custom-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      outline: none;
      white-space: nowrap;
      user-select: none;
    }

    .custom-btn:focus-visible {
      outline: 2px solid #a855f7;
      outline-offset: 3px;
    }

    /* Botão Instagram */
    .btn-instagram {
      background: rgba(22, 22, 38, 0.85);
      border: 1px solid rgba(138, 75, 255, 0.28);
      color: #f1f1f7;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .btn-instagram:hover {
      background: rgba(30, 28, 52, 0.95);
      border-color: rgba(168, 85, 247, 0.55);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(121, 40, 202, 0.35);
      color: #ffffff;
    }

    .btn-instagram:active {
      transform: translateY(0);
    }

    /* Botão WhatsApp com destaque roxo translúcido / gradiente */
    .btn-whatsapp {
      background: linear-gradient(135deg, #7928ca 0%, #4f46e5 100%);
      border: 1px solid rgba(216, 180, 254, 0.35);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(121, 40, 202, 0.45);
    }

    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #8a3ffc 0%, #6366f1 100%);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 28px rgba(121, 40, 202, 0.65), 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .btn-whatsapp:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: currentColor;
    }

    /* Rodapé */
    .page-footer {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: center;
      padding-top: 18px;
    }

    .footer-text {
      font-size: 0.78rem;
      color: var(--text-muted-custom);
      letter-spacing: 0.05em;
    }

    /* Responsividade Mobile First */
    @media (max-width: 540px) {
      body {
        padding: 20px 14px 16px;
      }

      .landing-wrapper {
        padding: 12px 6px;
      }

      .logo-container {
        --logo-width: 220px;
      }

      .action-group {
        flex-direction: column;
        width: 100%;
        gap: 12px;
      }

      .custom-btn {
        width: 100%;
        min-height: 52px;
      }
    }
  </style>
</head>
<body>

  <!-- Efeito visual de luz e profundidade -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Conteúdo centralizado -->
  <main class="landing-wrapper">

    <!-- (1) LOGO EM PNG -->
    <header class="logo-container fade-item fade-delay-1">

      <!-- =======================================================================
           LOGO PNG
           1. Crie uma pasta chamada "assets" ao lado deste index.html no GitHub
           2. Envie sua logo para dentro dela com o nome: logo.png
           3. Se usar outro nome/formato (ex: logo.webp), altere o src abaixo
           Dica: use PNG com fundo transparente. Ideal ter pelo menos 600px de
           largura para ficar nítida em telas de alta resolução.
           ======================================================================= -->
      <img
        class="logo-image"
        src="assets/logo.png"
        alt="Victorius — Transcende 365"
        width="280"
        decoding="async"
      >

      <!-- Título para leitores de tela e buscadores (invisível na tela) -->
      <h1 class="sr-only">Victorius — Transcende 365</h1>
    </header>

    <!-- (2) Badge / Pill EM BREVE -->
    <div class="fade-item fade-delay-2">
      <div class="badge-pill">
        <span class="badge-dot" aria-hidden="true"></span>
        <span>EM BREVE</span>
      </div>
    </div>

    <!-- (3) Headline Principal -->
    <h2 class="headline fade-item fade-delay-3">
      A corrida fortalece o corpo. A fé sustenta a jornada.
    </h2>

    <!-- (4) Sublinha Discreta -->
    <p class="subline fade-item fade-delay-4">
      Treine o corpo. Fortaleça a mente. Alimente a fé.
    </p>

    <!-- (5) Botões de Ação (Instagram e WhatsApp) -->
    <div class="action-group fade-item fade-delay-5">

      <!-- =======================================================================
           LINK DO INSTAGRAM
           SUBSTITUA pelo link do perfil do Victorius no Instagram
           Exemplo: href="https://www.instagram.com/seuperfil"
           ======================================================================= -->
      <a
        href="https://www.instagram.com/victorious.run/"
        target="_blank"
        rel="noopener noreferrer"
        class="custom-btn btn-instagram"
        aria-label="Acompanhe o Victorius no Instagram"
      >
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        <span>Instagram</span>
      </a>

      <!-- =======================================================================
           LINK DO WHATSAPP
           SUBSTITUA pelo link de convite do grupo do WhatsApp
           Exemplo: href="https://chat.whatsapp.com/SeuCodigoAqui"
           ======================================================================= -->
      <a
        href="https://chat.whatsapp.com/El3EmkjlPbYBmXujvzRkN3"
        target="_blank"
        rel="noopener noreferrer"
        class="custom-btn btn-whatsapp"
        aria-label="Entrar na comunidade VIP no WhatsApp"
      >
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.031 2C6.511 2 2.023 6.488 2.021 12.008c0 1.83.498 3.618 1.443 5.185L2 22l4.981-1.432c1.513.882 3.238 1.348 5.044 1.348h.005c5.518 0 10.007-4.488 10.009-10.008 0-2.674-1.041-5.187-2.932-7.078C17.216 2.939 14.704 2 12.031 2zm5.834 14.286c-.244.686-1.42 1.314-1.961 1.396-.518.077-1.196.11-3.447-.822-2.883-1.192-4.733-4.14-4.877-4.331-.144-.192-1.168-1.554-1.168-2.964 0-1.41.737-2.105 1-2.392.263-.287.574-.359.765-.359.192 0 .383.002.55.01.178.009.417-.067.652.497.244.587.832 2.032.905 2.181.072.148.12.324.024.516-.096.192-.144.312-.287.478-.144.168-.303.375-.433.504-.144.143-.294.298-.127.585.168.287.747 1.233 1.603 1.996 1.101.981 2.029 1.285 2.316 1.428.287.144.455.12.623-.072.168-.192.718-.838.91-1.125.192-.287.383-.24.646-.144.263.096 1.674.789 1.961.933.287.144.479.215.55.335.072.12.072.696-.172 1.382z"/>
        </svg>
        <span>Comunidade VIP</span>
      </a>

    </div>

  </main>

  <!-- (6) Rodapé Discreto -->
  <footer class="page-footer fade-item fade-delay-5">
    <p class="footer-text">
      &copy; 2026 Victorius®
    </p>
  </footer>

  <script>
    // Feedback de toque suave em mobile
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.custom-btn');
      buttons.forEach(btn => {
        btn.addEventListener('touchstart', () => {
          btn.style.transform = 'scale(0.98)';
        }, { passive: true });

        btn.addEventListener('touchend', () => {
          btn.style.transform = '';
        }, { passive: true });
      });
    });
  </script>
</body>
</html>
